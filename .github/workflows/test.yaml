name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    name: Test

    permissions:
      id-token: write
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terraform
          - tool: opentofu

    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch Git tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Terraform
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8 # datasource=github-releases depName=hashicorp/terraform
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: matrix.tool == 'opentofu'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5 # datasource=github-releases depName=opentofu/opentofu
          tofu_wrapper: false

      # GoReleaser comes from mise rather than goreleaser-action so its version
      # lives in mise.toml only, instead of being pinned again here, and so the
      # download is verified against the checksum in mise.lock.
      - name: Set up GoReleaser
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.13 # datasource=github-releases depName=jdx/mise
          install_args: goreleaser

      - name: Run GoReleaser
        run: goreleaser build --clean --snapshot --single-target --output tf

      - name: Run tests
        run: make test
