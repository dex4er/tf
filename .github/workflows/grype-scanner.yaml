name: Grype Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 38 20 * * *
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Grype scan

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      # Renovate keeps this version up to date via the inline datasource hint
      # below (see .renovaterc.json5 customManagers).
      GRYPE_VERSION: v0.116.0 # datasource=github-releases depName=anchore/grype

      # Code scanning is only fed from the real branch build of this repository.
      # Pull requests from forks are not granted security-events: write, so the
      # upload would fail there, and a fork's own main branch has no business
      # writing to it either.
      UPLOAD_SARIF: ${{ github.repository == 'dex4er/tf' && github.ref_name == 'main' && github.event_name != 'pull_request' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Scan the compiled binary rather than the source tree: a source scan sees
      # only the modules listed in go.mod, while the Go stdlib version - the
      # only realistic source of vulnerabilities in a project with four tiny
      # dependencies - is recorded in the binary alone. One target is enough,
      # because a Go binary links the same dependency set regardless of the
      # target OS/arch. Build flags mirror the release build (see
      # .goreleaser.yaml) so the scanned closure matches what gets published.
      - name: Build binary
        run: go build -trimpath -o tf .
        env:
          CGO_ENABLED: "0"

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      # json is produced alongside sarif because post-scan-report needs fields
      # sarif does not carry: component type, installed/fixed-in versions and
      # the risk score.
      #
      # GRYPE_MATCH_GOLANG_ALWAYS_USE_CPE_FOR_STDLIB is not optional here: as of
      # grype 0.116.0 the Go standard library is matched through CPEs only, and
      # that setting defaults to false, so a binary built with a Go release
      # carrying known CVEs scans clean without a single warning (0.112.0 still
      # reported them from govulndb, 0.116.0 reports nothing). The stdlib is the
      # only realistic source of vulnerabilities in a project with four tiny
      # dependencies, so leaving it off would make this whole workflow report
      # "no vulnerabilities found" by construction.
      - name: Scan binary with Grype
        run: |
          set -eo pipefail
          "${{ steps.grype.outputs.cmd }}" file:tf -o sarif=grype.sarif -o json=grype.json
        env:
          GRYPE_MATCH_GOLANG_ALWAYS_USE_CPE_FOR_STDLIB: "true"

      # Grype points every finding at the scanned file ("/tf"), an absolute path
      # that does not exist in the repository, so code scanning cannot map the
      # alert to any source. Repoint them at go.mod, which is where all of these
      # findings are actually fixed: the go directive for stdlib CVEs, the
      # require lines for module ones.
      - name: Set SARIF locations
        if: env.UPLOAD_SARIF == 'true'
        run: |
          set -eo pipefail
          yq -pj -oj '
            .runs[0].results = (
              (.runs[0].results // []) |
              map(.locations = [{"physicalLocation": {"artifactLocation": {"uri": "go.mod"}}}])
            )
          ' grype.sarif > grype-located.sarif
          mv grype-located.sarif grype.sarif

      - name: Upload Grype SARIF to code scanning
        if: env.UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: grype.sarif
          category: grype

      - name: Upload vulnerability report
        if: github.ref_name == 'main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: "${{ github.event.repository.name }}-grype.json"
          path: grype.json

  post-scan-report:
    name: post scan report to discussion

    # Turns the Grype JSON report from the scan job into a markdown table and
    # replaces the tracking discussion's body with it, so the discussion always
    # reflects the latest main-branch scan. Runs for the real branch build
    # (push/dispatch on main) of this repository only, never for PRs: the
    # tracking discussion does not exist in a fork.
    if: github.repository == 'dex4er/tf' && github.ref_name == 'main' && github.event_name != 'pull_request'

    needs:
      - scan

    runs-on: ubuntu-24.04-arm

    permissions:
      actions: read
      discussions: write

    env:
      DISCUSSION_NUMBER: 134

    steps:
      - name: Download vulnerability report
        uses: actions/download-artifact@v8
        with:
          name: "${{ github.event.repository.name }}-grype.json"

      - name: Build vulnerability table
        run: |
          set -eo pipefail
          # Flatten each match into a table row. severity/risk/type/installed
          # version/fixed-in version come straight from grype's JSON fields
          # (mirroring its own default table columns); the advisory link uses
          # vulnerability.dataSource. The location column grype's own table has
          # is dropped: every finding sits in the same scanned binary. negrisk
          # is a sort-only helper: yq has no unary minus, so descending-by-risk
          # needs the value pre-negated.
          yq -pj -oj '
            ({"Critical":0,"High":1,"Medium":2,"Low":3,"Negligible":4,"Unknown":5}) as $rank
            | (.matches // [])
            | map(
                {
                  "severity": .vulnerability.severity,
                  "risk": (.vulnerability.risk // 0),
                  "package": .artifact.name,
                  "type": .artifact.type,
                  "installed": .artifact.version,
                  "fixed": ((.vulnerability.fix.versions // []) | join(", ")),
                  "advisory": ("[" + .vulnerability.id + "](" + (.vulnerability.dataSource // "") + ")"),
                  "rank": ($rank[.vulnerability.severity] // 9),
                  "negrisk": (0 - (.vulnerability.risk // 0))
                }
              )
            | sort_by(.rank, .negrisk, .package)
            | map(del(.rank) | del(.negrisk))
          ' grype.json > rows.json
          count=$(yq -pj -oj 'length' rows.json)
          {
            echo "Grype vulnerability scan of the built binary for [\`${GITHUB_SHA:0:12}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), updated $(date -u +'%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            if [[ "$count" -eq 0 ]]; then
              echo "No vulnerabilities found."
            else
              echo "| Severity | Risk | Package | Type | Installed | Fixed In | Advisory |"
              echo "| --- | --- | --- | --- | --- | --- | --- |"
              # LC_ALL=C: printf "%.1f" must use a period regardless of the
              # runner's locale, or it silently truncates "6.6" to "6" (parsed
              # up to the first non-digit) and re-renders it as "6,0".
              yq -pj -ot rows.json | tail -n +2 |
                LC_ALL=C awk -F'\t' '{printf "| %s | %.1f | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7}'
            fi
          } > body.md
          echo "vulnerabilities: $count"

      - name: Update discussion
        run: |
          set -eo pipefail
          discussion_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                discussion(number:$num){ id }
              }
            }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" -F num="$DISCUSSION_NUMBER" \
            --jq '.data.repository.discussion.id')
          if [[ -z "$discussion_id" || "$discussion_id" == "null" ]]; then
            echo "Discussion #$DISCUSSION_NUMBER not found" >&2
            exit 1
          fi
          gh api graphql -f query='
            mutation($id:ID!,$body:String!){
              updateDiscussion(input:{discussionId:$id, body:$body}){
                discussion{ id }
              }
            }' -f id="$discussion_id" -F body=@body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
