version: 2

project_name: tf

force_token: github

before:
  hooks:
    - go mod download

builds:
  - binary: tf
    env:
      - CGO_ENABLED=0
    goarch:
      - amd64
      - arm64
    goos:
      - darwin
      - linux
      - windows
    flags:
      - -trimpath

archives:
  - name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - binary

sboms:
  - artifacts: binary
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    args:
      - $artifact
      - --output
      - spdx-json=$document

checksum:
  name_template: checksums.txt

changelog:
  use: github
  # The release notes are for the users of tf, so the updates that change only
  # CI, the development tools or the configuration of Renovate stay out. The
  # updates of Go and of the Go modules stay in, as they change the binaries.
  filters:
    exclude:
      - ^Automated trunk upgrade
      - ^Lock file maintenance
      - "^Renovate: "
      - "^Update \\S+ action to "
      - "^Update dependency (@biomejs/biome|anchore/grype|goreleaser|hashicorp/terraform|jdx/mise|opentofu/opentofu|terraform|ubuntu|yq) to "

homebrew_casks:
  - name: tf
    description: Less verbose, more shell-friendly and LLM-friendly Terraform and OpenTofu
    homepage: https://github.com/dex4er/tf
    binaries:
      - tf
    repository:
      owner: dex4er
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}"
    # The released binaries are neither signed nor notarized, so without
    # clearing the quarantine attribute Gatekeeper refuses to run tf after a
    # cask install. Casks have no license field, so the MIT declaration that
    # the formula carried is gone - it lives in LICENSE and in the repository
    # metadata.
    #
    # The upstream example points xattr at "{{ .StagedPath }}/<name>", which
    # does not exist here: the archives are bare binaries, so the staged file
    # keeps its artifact name (tf-darwin-arm64) - see the binary stanzas in the
    # generated cask. The install steps are shared by every platform block and
    # cannot know which one, so clear the whole staged directory recursively
    # instead.
    #
    # install_steps, Homebrew's declarative DSL, rather than the raw Ruby of
    # install: Homebrew deprecated the postflight block that install
    # generates, and warns about it on every brew command (#154).
    hooks:
      post:
        install_steps: |-
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
          end
